* {
	box-sizing: border-box;
	padding: 0px;
}

*::-webkit-scrollbar{
    width: 10px;
    height: 10px;
    background-color: #222;
}

*::-webkit-scrollbar-corner{
    background-color: #333;
}

*::-webkit-scrollbar-thumb{
    background: #666;
    border: 1px solid #999;
    border-radius: 5px;
}

*::-webkit-scrollbar-thumb:hover{
    background: #CCC;
    border-radius: 5px;
}
	

html,
body {
	margin: 0;
	height: 100vh;
	width: 100vw;
	background-color:black;
	overflow: hidden;
}
		
		
/*Flexbox gives us the flexiness we need. The top just stays put as there is no scrolling on the body due to the page never exceeding viewport height*/
.CONTROLS_CONTAINER {
	display: flex;
	width:100vw;
	height: 30px;
	position: fixed;
	top:0vh;
	left:0vh;
	opacity: 1;
	background: #222;
	overflow-x: auto;
}

.CONTROLS_CONTAINER .FILE_INPUT_TOGGLE {
	padding-left: 10px;
	padding-right: 10px;
	height: 30px;
	text-align: center;
	align-content: center;
	color: white;
	font-family: Inconsolata;
    font-size: 15px;
    border: 1px solid gray;
	border-radius: 5px;
	background-color: #333333;
	z-index: 10;
	cursor:default;
}

<!-- Equation.js -->
<script> 
var NODE_POINT = "POINT";
var NODE_BACK_CONTACT = "BACK_CONTACT";
var NODE_FRONT_CONTACT = "FRONT_CONTACT";
var NODE_COIL = "COIL";
var OPERATOR_NOT = "NOT";
var OPERATOR_AND = "AND";
var OPERATOR_OR = "OR";
var OPERATOR_OPEN_PAREN = "(";
var OPERATOR_CLOSE_PAREN = ")";


function Node(row , col , node_type , node_id , name){
	if (name === undefined) {
		name = ""
	}
	this.row = row;
	this.col = col;
	this.node_type = node_type;
	this.id = node_id;
	this.name = name;
	this.next_id1 = undefined;
	this.next_id2 = undefined;
}

function Equation(out_list , expr_list , eq_type){
	this.equation_type = eq_type;
	this.expression = [];
	this.inputs = [];
	this.outputs = [];
	this.nodes = [];
    this.start_id = undefined;
    this.num_row = 0;
    this.num_col = 0;
    this.num_not = 0;
    this.num_and = 0;
    this.num_or = 0;
    
    this.setup_inputs_outputs_expression(out_list,expr_list);
    
    var eq = {start_ids:[],end_ids:[],num_row:0,num_col:0};
	this.start_id = this.add_node(1,1,NODE_POINT,"START");
	eq.start_ids.push(this.start_id);
	eq.end_ids.push(this.start_id);
	
	var expr_start_row = 1, expr_start_col = 1;
	expr = this.process_expression(this.expression , expr_start_row , expr_start_col);
	
	var out_start_row = 1;
	var out_start_col = expr.num_col+1;
	out = this.process_outputs(out_start_row,out_start_col);
    
    eq = this.combine_series(eq,expr);
    eq = this.combine_series(eq,out);
    this.num_row = eq.num_row;
    this.num_col = eq.num_col;
}

Equation.prototype.count_fronts = function(name){
	let num = 0;
	for (let node of this.nodes){
		if (node.node_type == NODE_FRONT_CONTACT && node.name == name){
			num += 1;
		}
	}
	return num;
}

Equation.prototype.count_backs = function(name){
	let num = 0;
	for (let node of this.nodes){
		if (node.node_type == NODE_BACK_CONTACT && node.name == name){
			num += 1;
		}
	}
	return num;
}

Equation.prototype.setup_inputs_outputs_expression = function(out_list , expr_list){
	var i,op,formatted_op,out_bit,formatted_out;
	for (i = 0 ; i < expr_list.length ; i ++){
		op = expr_list[i];
		formatted_op = op.trim().toUpperCase();
		this.expression.push(formatted_op);
		// Update operator counts and inputs array
		switch(formatted_op){
			case OPERATOR_AND:
				this.num_and++;
				break;
			case OPERATOR_OR:
				this.num_or++;
				break;
			case OPERATOR_NOT:
				this.num_not++;
				break;
			case OPERATOR_OPEN_PAREN:
				break;
			case OPERATOR_CLOSE_PAREN:
				break;
			default:
				this.inputs.push(formatted_op); // Add to the inputs list
		}
	}
	// Getting the output bit list from the output string
	for (i = 0 ; i < out_list.length ; i++){
		out_bit = out_list[i];
		formatted_out = out_bit.trim().toUpperCase();
		this.outputs.push(formatted_out);
	}
};

Equation.prototype.add_node = function(row , col , node_type , name){
	var node_id = this.nodes.length;
	this.nodes.push(new Node(row , col , node_type , node_id , name));
	return node_id;
};

Equation.prototype.add_next_id1_to_node = function(node_id , next_node_id){
	var node = this.nodes[node_id];
	if (node.next_id1 === undefined){
		node.next_id1 = next_node_id;
	}
};

Equation.prototype.add_next_id2_to_node = function(node_id , next_node_id){
	var node = this.nodes[node_id];
	if (node.next_id2 === undefined){
		node.next_id2 = next_node_id;
	}
};

Equation.prototype.combine_series = function(cur , next){
	var i;
	var combined = {start_ids:[],end_ids:[],num_row:0,num_col:0};
	if (cur.end_ids.length === 0){
		combined.start_ids = combined.start_ids.concat(next.start_ids);	
		combined.end_ids = combined.end_ids.concat(next.end_ids);
		combined.num_row = next.num_row;
		combined.num_col = next.num_col;
		return combined;
	}

	var cur_end_node_id = cur.end_ids.pop();
	var next_start_node_id = next.start_ids.pop();
	var point_col = this.get_node_col(next_start_node_id);
	var start_node_id,end_node_id,point_row,point_id;
	while (cur.end_ids.length > 0){
		end_node_id = cur.end_ids.pop();
		point_row = this.get_node_row(end_node_id);
		point_id = this.add_node(point_row,point_col,NODE_POINT);
		this.add_next_id1_to_node(end_node_id , point_id);
		this.add_next_id1_to_node(cur_end_node_id , point_id);
		cur_end_node_id = point_id;
	}
		
	while (next.start_ids.length > 0){
		start_node_id = next.start_ids.pop();
		point_row = this.get_node_row(start_node_id);
		point_id = this.add_node(point_row,point_col,NODE_POINT);
		this.add_next_id1_to_node(point_id , start_node_id);
		this.add_next_id2_to_node(point_id , next_start_node_id);
		next_start_node_id = point_id;
	}
	this.add_next_id1_to_node(cur_end_node_id , next_start_node_id);
	
	combined.start_ids = combined.start_ids.concat(cur.start_ids);
	combined.end_ids = combined.end_ids.concat(next.end_ids);
	combined.num_col = cur.num_col + next.num_col; // Num of columns is added
	combined.num_row = Math.max(cur.num_row , next.num_row); // Number of rows is updated to the max of both row size
	return combined;
};

Equation.prototype.combine_parallel = function(cur , next){
	var i;
	var combined = {start_ids:[],end_ids:[],num_row:0,num_col:0};
	combined.start_ids = combined.start_ids.concat(cur.start_ids , next.start_ids);
	combined.end_ids = combined.end_ids.concat(cur.end_ids , next.end_ids);
	combined.num_row = cur.num_row + next.num_row;
	combined.num_col = Math.max(cur.num_col , next.num_col);
	return combined;
};

Equation.prototype.process_expression = function(expr_list , row , col , negation){
	if (negation === undefined){
		negation = false;
	}
	var expr = {start_ids:[] , end_ids:[] , num_row:0 , num_col:0};
	
	//  Base case of single operand
	if (expr_list.length === 1){
		var node_id;
		expr.num_row = 1; // update number of rows needed to 1
		expr.num_col = 1; // update number of columns needed to 1
		if (negation){ // This Node is being negated, made Back Contact
			node_id = this.add_node(row,col,NODE_BACK_CONTACT,expr_list[0]);
		}
		else{ // This Node is not being negated, made Front Contact
			node_id = this.add_node(row,col,NODE_FRONT_CONTACT,expr_list[0]);
		}
		expr.start_ids.push(node_id);
		expr.end_ids.push(node_id);
		return expr;
	}
		
	//  Multiple operands and operators        
	var current_node_negation = false; // Variable for storing the effect of the NOT operator for the next Node
	var index = 0;   // index of current operand/operator
	var start_paren,num_inner_paren,next_row,next_col;
	while (index < expr_list.length){
		switch(expr_list[index]){
			case OPERATOR_OPEN_PAREN: // Encountered '(' operator
				start_paren = index;
				num_inner_paren = 0; // variable to keep track of internal parenthesis pairs
				index += 1;  // start looking at the next index since current operator is '('
				while (expr_list[index] !== OPERATOR_CLOSE_PAREN || num_inner_paren !=0){ // Looking for the closing ')' operator
					if (expr_list[index] === OPERATOR_OPEN_PAREN){
						num_inner_paren += 1;
					}
					if (expr_list[index] === OPERATOR_CLOSE_PAREN){
						num_inner_paren -= 1;
					}
					index += 1;  // update index to check next operator or operand
				}
				// Found closing ')' at current index value
				// Create an Expression for the operands and operators inside the parenthesis
				if (negation){ // Check to see if we need to apply deMorgan's conversion.
					// if conversion needed, combine the parenthesis Expression in parallel
					next_row = row + expr.num_row;
					next_col = col;
					next = this.process_expression(expr_list.slice(start_paren+1,index) , next_row , next_col , Boolean(negation^current_node_negation));
					expr = this.combine_parallel(expr , next);
				}
				else {
					// if conversion not needed, combine the parenthesis Expression in series
					next_row = row
					next_col = col + expr.num_col
					next = this.process_expression(expr_list.slice(start_paren+1,index) , next_row , next_col , Boolean(negation^current_node_negation));
					expr = this.combine_series(expr , next);
				}
				current_node_negation = false // reset variable after negation operation is done
				break;
			case OPERATOR_NOT: // Encountered 'NOT' operator
				current_node_negation = ! current_node_negation; // Set the variable to negate next operand
				break;
			case OPERATOR_OR: // Encountered 'OR' operator
				if (negation){ // Check to see if we need to apply deMorgan's conversion.
					// if conversion needed, combine the parenthesis Expression in Series
					next_row = row;
					next_col = col + expr.num_col;
					next = this.process_expression(expr_list.slice(index+1) , next_row , next_col , negation );
					expr = this.combine_series(expr , next);
				}
				else {
					// if conversion not needed, combine the parenthesis Expression in parallel
					next_row = row + expr.num_row;
					next_col = col;
					next = this.process_expression(expr_list.slice(index+1) , next_row , next_col , negation );
					expr = this.combine_parallel(expr , next);
				}
				index = expr_list.length;
				break;
			case OPERATOR_AND:
				break;
			default: // Encountered an operand
				if (negation){ // Check to see if we need to apply deMorgan's conversion.
					// if conversion needed, combine the parenthesis Expression in Parallel
					next_row = row + expr.num_row;
					next_col = col;
					next = this.process_expression(expr_list.slice(index,index+1) , next_row , next_col , Boolean(negation^current_node_negation));
					expr = this.combine_parallel(expr , next);
				}
				else {
					// if conversion not needed, combine the parenthesis Expression in Series
					next_row = row;
					next_col = col + expr.num_col;
					next = this.process_expression(expr_list.slice(index,index+1) , next_row , next_col , Boolean(negation^current_node_negation));
					expr = this.combine_series(expr , next);
				}
				current_node_negation = false; // reset variable after negation operation is done
		}
		index += 1; // increment index
	}
	return expr;
	
};

Equation.prototype.process_outputs = function(row , col){
	var i;
	var tmp_id;
	var out = {start_ids:[],end_ids:[],num_row:0,num_col:0};
	var coil = {start_ids:[],end_ids:[],num_row:0,num_col:0};
	
	out_start_id = this.add_node(row,col,NODE_POINT);
	out.start_ids.push(out_start_id);
	out.end_ids.push(out_start_id);
	
	coil_col = col + 1; // 1 column of space
	coil.num_row = this.outputs.length;
	coil.num_col = 2; // 1 column of space between expression and outputs, 1 column for outputs coils
	for (i=0;i<coil.num_row;i++){
		tmp_id = this.add_node(row+i,coil_col,NODE_COIL,this.outputs[i]);
		coil.start_ids.push(tmp_id);
		coil.end_ids.push(tmp_id);
	}

	out = this.combine_series(out , coil);
	return out;
};

Equation.prototype.get_node_row = function(node_id){
	return this.nodes[node_id].row;
};

Equation.prototype.get_node_col = function(node_id){
	return this.nodes[node_id].col;
};

Equation.prototype.get_node_name = function(node_id){
	return this.nodes[node_id].name;
};
	
Equation.prototype.get_node_type = function(node_id){
	return this.nodes[node_id].node_type;
};

Equation.prototype.get_node_next_id1 = function(node_id){
	return this.nodes[node_id].next_id1;
};

Equation.prototype.get_node_next_id2 = function(node_id){
	return this.nodes[node_id].next_id2;
};

Equation.prototype.get_equation_string = function(){
	let eq_str = "";
    if (this.equation_type == "MLKNV"){
		eq_str = "NV.ASSIGN " + this.expression.join(" ") + " TO " + this.outputs.join(" , ") + ";";
        return eq_str.replace(/ NOT /gi , " ~ ").replace(/ AND /gi , " * ").replace(/ OR /gi , " + ");
    }
    else if (this.equation_type == "MLKV"){
		eq_str = "ASSIGN " + this.expression.join(" ") + " TO " + this.outputs.join(" , ") + ";";
        return eq_str.replace(/ NOT /gi , " ~ ").replace(/ AND /gi , " * ").replace(/ OR /gi , " + ");
    }
    else if (this.equation_type == "VPI_BOOL"){
		eq_str = "BOOL " + this.outputs.join(" , ")  + " = ( " + this.expression.join(" ") + " )";
        return eq_str.replace(/ NOT /gi , " .N. ").replace(/ AND /gi , " * ").replace(/ OR /gi , " + ");
    }
	else if (this.equation_type == "VPI_SLOW"){
        eq_str = "SLOW " + this.outputs.join(" , ")  + " = ( " + this.expression.join(" ") + " )";
        return eq_str.replace(/ NOT /gi , " .N. ").replace(/ AND /gi , " * ").replace(/ OR /gi , " + ");
    }
    return "";
};


</script>

<script>
function Wire_SVG(svg , sx,sy , nx,ny , start , non_vital , codedOutput){
	this.wire = document.createElementNS("http://www.w3.org/2000/svg" , "polyline");
	this.wire.setAttribute("class" , "WIRE_OFF");
	if (start){
		this.wire.setAttribute("points" , [sx-30,sy-5 , sx-25,sy , sx-30,sy+5 , sx-25,sy , sx,sy , nx,sy , nx,ny].toString());
		
		let batt_type = document.createElementNS("http://www.w3.org/2000/svg" , "text");
		batt_type.setAttribute("style" , "text-anchor:end;stroke:none;font-family:Inconsolata;font-size:10px;cursor:default;");
		batt_type.setAttribute("class" , "TEXT");
		batt_type.setAttribute("x" , (sx-35).toString());
		batt_type.setAttribute("y" , (sy+4).toString());
		if (non_vital){
			batt_type.textContent = "NVB";
		}
		else if (codedOutput){
			batt_type.textContent = "TOGGLE";
		}
		else {
			batt_type.textContent = "VB";
		}
		svg.appendChild(batt_type);
		
		
	}
	else{
		this.wire.setAttribute("points" , [sx,sy , nx,sy , nx,ny].toString());
	}
	svg.appendChild(this.wire);
}

Wire_SVG.prototype.change_states = function(wire_state){
	var new_wire_class = wire_state ? "WIRE_ON" : "WIRE_OFF";
	this.wire.setAttribute("class" , new_wire_class);
};

};

<script>
function Coil_SVG(svg , sx,sy , name , column_width , xside , yside , set_time=undefined , drop_time=undefined , vital=true , logged=false){
	var cx = sx + (column_width-xside)/2 + 1;
	var cy = sy;
	var coords =  [	sx,sy , cx,cy , cx+(xside*4/10),cy , cx+(xside*4/10),cy+(yside*1/10) ,
					cx+(xside*8/10),cy+(yside*1/10) , cx+(xside*7/10),cy+(yside*1/10)  ,
					cx+(xside*7/10),cy+(yside*5/10) , cx+(xside*8/10),cy+(yside*5/10)  ,
					cx+(xside*2/10),cy+(yside*5/10) , cx+(xside*3/10),cy+(yside*5/10)  ,
					cx+(xside*3/10),cy+(yside*1/10) , cx+(xside*2/10),cy+(yside*1/10)  ,
					cx+(xside*6/10),cy+(yside*1/10) , cx+(xside*6/10),cy  , 
					cx+(xside*10/10),cy , sx+column_width,sy  ,
					sx+column_width-5,sy-5 , sx+column_width,sy , sx+column_width-5,sy+5 ];
	
	var nv_coords =  [	sx,sy , cx,cy , cx+(xside*1/10),cy , cx+(xside*1/10),cy+(yside*3/10) ,
					cx+(xside*3/10),cy+(yside*3/10) , cx+(xside*3/10),cy+(yside*5/10)  ,
					cx+(xside*3/10),cy+(yside*1/10) , cx+(xside*7/10),cy+(yside*1/10)  ,
					cx+(xside*7/10),cy+(yside*5/10) , cx+(xside*3/10),cy+(yside*5/10)  ,

<!-- Equation_SVG.js -->
<script>
//INCONSOLATA FONT - SIZE:12PX - LETTER_WIDTH: 6PX - LETTER_HEIGHT:12PX


var LSIZE = 8;	//6px text width, ASSUMES 12PX FONT-SIZE
var PADDING = 20;
var SIDE = 50;	//12px text height - 3*text_height+14 = 50px
var MIN_COL_WIDTH = SIDE+PADDING; //SIDE+PADDING
var SHOW_LOG_IN_CONTACTS = true;

const OPERATORS = {"XOR":"@", "OR":"+", "AND":"*", "NOT":"~"};


function Equation_SVG(output_list , expression_list , equation_type , timers , non_vital , coderDef , log_bits){
	this.update_cycle = 1;
	this.bit_states = {};
	this.in_states = [];
	this.equation_elements = [];
	this.svg = document.createElementNS("http://www.w3.org/2000/svg" , "svg");
	this.column_width = [];
	this.column_start = [];
	this.equation = undefined;
	this.equation_inputs = [];
	this.equation_outputs = [];
	this.equation_expression = expression_list;
	this.equation_string = "";
	this.equation_type = equation_type;
	if (expression_list.indexOf("XOR") != -1){
		
		this.equation_string = (equation_type == "MLKNV") ? "NV.ASSIGN " : "ASSIGN " + expression_list.join(" ") + " TO " + output_list.join(", ") + ";";
		this.equation_string = this.equation_string.replaceAll(" OR " , ` + `);
		this.equation_string = this.equation_string.replaceAll(" XOR " , ` @ `);
		this.equation_string = this.equation_string.replaceAll(" AND " , ` * `);
		this.equation_string = this.equation_string.replaceAll(" NOT " , ` ~ `);
		let width = this.equation_string.length * LSIZE + 100;
		this.svg.setAttribute("width" , width.toString());
		this.svg.setAttribute("height" , "100");
		let eq_text = document.createElementNS("http://www.w3.org/2000/svg" , "text");
		eq_text.setAttribute("class" , "TEXT");
		eq_text.setAttribute("x" , (width/2).toString());
		eq_text.setAttribute("y" , "50");
		let equation_html = (equation_type == "MLKNV") ? `<tspan class="EQ_SPECIAL">NV.ASSIGN</tspan> ` : `<tspan class="EQ_SPECIAL">ASSIGN</tspan> `;
		for (let idx=0 ; idx<expression_list.length ; idx++){
			if ( ["AND","OR","NOT",")","(","XOR"].indexOf(expression_list[idx]) == -1){
				if (this.equation_inputs.indexOf(expression_list[idx]) == -1 ){
					this.equation_inputs.push(expression_list[idx]);
				}
				equation_html += `<tspan class="TEXT">${expression_list[idx]}</tspan> `;
			}
			else {
				equation_html += `<tspan class="EQ_OPERATOR">${OPERATORS[expression_list[idx]]}</tspan> `;
			}
		}
		equation_html += `<tspan class="EQ_SPECIAL">TO</tspan> `;
		for (let idx=0 ; idx<output_list.length-1 ; idx++){
			equation_html += `<tspan class="TEXT">${output_list[idx]}</tspan> `;
		}
		equation_html += `<tspan class="TEXT">${output_list[output_list.length-1]}</tspan><tspan class="EQ_SPECIAL">;</tspan>`;
		
		if (equation_type == "MLKV"){
			equation_html = equation_html.replaceAll("ASSIGN " , `<tspan style="fill:#8787c2">ASSIGN</tspan> `);
		}
		else{
			equation_html = equation_html.replaceAll("NV.ASSIGN " , `<tspan style="fill:#8787c2">NV.ASSIGN</tspan> `);
		}
		eq_text.innerHTML = equation_html;
		for (let t of eq_text.childNodes){
			if (t.classList && t.classList.contains("TEXT")){
				t.addEventListener("dblclick" , text_mouse_dblclick );
				t.addEventListener("mousedown" , text_mouse_down );
				t.addEventListener("mouseenter" , text_mouse_enter );
				t.addEventListener("mouseleave" , text_mouse_leave );
			}
		}
		this.svg.appendChild(eq_text);
		this.equation_outputs = output_list;
		
	}
	else{
		this.equation = new Equation(output_list , expression_list , equation_type);
		this.equation_inputs = this.equation.inputs;
		this.equation_outputs = this.equation.outputs;
		this.equation_string = this.equation.get_equation_string();
		
		
		var xside = yside = SIDE; 
		//resetting column_width, column_start
		var i;
		for (i=0 ; i<this.equation.num_col+2 ; i++){
			this.column_width.push(MIN_COL_WIDTH);
			this.column_start.push(0);
		}
		var node_id , node_col , node_name;
		for (node_id=0 ; node_id<this.equation.nodes.length ; node_id++){
			node_col = this.equation.get_node_col(node_id);
			node_name = this.equation.get_node_name(node_id);
			width = LSIZE*node_name.length + PADDING; 
			this.column_width[node_col] = Math.max(this.column_width[node_col] , width);
		}
		for (i=0 ; i< this.column_width.length-1 ; i++){
			this.column_start[i+1] = this.column_start[i] + this.column_width[i];
		}
		
		this.equation_height = (this.equation.num_row + 1) * yside;
		this.equation_width = this.column_start[this.column_start.length-1]+this.column_width[this.column_width.length-1] + xside * 2;
		this.svg.setAttribute("width" , "1900");
		this.svg.setAttribute("height" , this.equation_height.toString());
		if (this.equation_width > 1900){
			//this.svg.setAttribute("transform" , `scale(${Math.min(1900/this.equation_width, 1)} 1)`);
			//this.svg.setAttribute("transform-origin" , "0 0" );
			this.svg.setAttribute("style", `transform-origin:0 0; transform: scale(${Math.min(1900/this.equation_width, 1)}, 1) translateX(calc((100vw - min(100vw, 1900px)) / 5))`);
		}
		
		
		
		var sx,sy,nx,ny;
		var node_type,next_id,name,column_width;
		for (node_id=0 ; node_id<this.equation.nodes.length ; node_id++){
			node_type = this.equation.get_node_type(node_id);
			switch (node_type){
				case NODE_POINT:
					next_id = this.equation.get_node_next_id2(node_id);
					if (!next_id){
						next_id = this.equation.get_node_next_id1(node_id);
					}
					sx = nx = this.column_start[this.equation.get_node_col(node_id)];
					sy = ny = this.equation.get_node_row(node_id) * yside;
					if (next_id){
						nx = this.column_start[this.equation.get_node_col(next_id)];
						ny = this.equation.get_node_row(next_id) * yside;
					}
					start_node = (this.equation.get_node_name(node_id) == "START");
					this.equation_elements[node_id] = new Wire_SVG(this.svg , sx,sy,nx,ny , start_node , this.equation.equation_type === "MLKNV" , coderDef);
					break;
				case NODE_FRONT_CONTACT:
					name = this.equation.get_node_name(node_id);
					column_width = this.column_width[this.equation.get_node_col(node_id)];
					sx = this.column_start[this.equation.get_node_col(node_id)];
					sy = this.equation.get_node_row(node_id) * yside;
					next_id = this.equation.get_node_next_id1(node_id);
					nx = this.column_start[this.equation.get_node_col(next_id)];
					ny = this.equation.get_node_row(next_id) * yside;
					let ppm = undefined;
					if (coderDef && name in coderDef){
						ppm = coderDef[name];
					}
					this.equation_elements[node_id] = new Front_Contact_SVG(this.svg,sx,sy,nx,ny,name,column_width,xside,yside,!(non_vital && name in non_vital),ppm,SHOW_LOG_IN_CONTACTS && log_bits && log_bits.includes(name));
					break;
				case NODE_BACK_CONTACT:
					name = this.equation.get_node_name(node_id);
					column_width = this.column_width[this.equation.get_node_col(node_id)];
					sx = this.column_start[this.equation.get_node_col(node_id)];
					sy = this.equation.get_node_row(node_id) * yside;
					next_id = this.equation.get_node_next_id1(node_id);
					nx = this.column_start[this.equation.get_node_col(next_id)];
					ny = this.equation.get_node_row(next_id) * yside;
					this.equation_elements[node_id] = new Back_Contact_SVG(this.svg,sx,sy,nx,ny,name,column_width,xside,yside,!(non_vital && name in non_vital),SHOW_LOG_IN_CONTACTS && log_bits && log_bits.includes(name));
					break;
				case NODE_COIL:
					name = this.equation.get_node_name(node_id);
					column_width = this.column_width[this.equation.get_node_col(node_id)];
					sx = this.column_start[this.equation.get_node_col(node_id)];
					sy = this.equation.get_node_row(node_id) * yside;
					let set_str = undefined;
					let clear_str = undefined;
					if (timers && name in timers){
						set_str = timers[name].set;
						clear_str = timers[name].clear;
					}
					this.equation_elements[node_id] = new Coil_SVG(this.svg,sx,sy,name,column_width,xside,yside,set_str,clear_str,!(non_vital && name in non_vital),log_bits && log_bits.includes(name));
					
					if (coderDef){
						let coded_output_text = document.createElementNS("http://www.w3.org/2000/svg" , "text");
						coded_output_text.setAttribute("style" , "font-size:10px");
						coded_output_text.setAttribute("class" , "TEXT");
						coded_output_text.setAttribute("x" , (sx+column_width/2).toString());
						coded_output_text.setAttribute("y" , (sy+yside-15).toString());
						coded_output_text.textContent = "CODED OUTPUT";
						this.svg.appendChild(coded_output_text);
					}
					
					
					break;
				default:
					console.log("unknown node type encounter...");
			}
		}
		
		this.equation_out_state = false;
		var bit;
		for (i=0 ; i<this.equation.inputs.length ; i++){
			bit = this.equation.inputs[i];
			this.bit_states[bit] = false;
		}
		for (i=0 ; i<this.equation.outputs.length ; i++){
			bit = this.equation.outputs[i];
			this.bit_states[bit] = false;
		}
		this.trace_battery(this.equation.start_id , this.update_cycle);
	}
}

Equation_SVG.prototype.trace_battery = function(start_id , in_state){
	if (!this.equation){
		return;
	}
	if (this.in_states[start_id] === this.update_cycle){
		return;
	}
	this.in_states[start_id] = in_state;
	var node_type = this.equation.get_node_type(start_id);
	var node_id;
	var bit_state , out_state;
	switch (node_type){
		case NODE_POINT:
			this.equation_elements[start_id].change_states(in_state>0);
			node_id = this.equation.get_node_next_id1(start_id);
			if (node_id){
				this.trace_battery(node_id , in_state);
			}
			node_id = this.equation.get_node_next_id2(start_id);
			if (node_id){
				this.trace_battery(node_id , in_state);
			}
			break;
		case NODE_FRONT_CONTACT:
			out_state = -this.update_cycle;
			bit_state = this.bit_states[this.equation.get_node_name(start_id)];
			if (bit_state){
				out_state = in_state;
			}
			this.equation_elements[start_id].change_states(in_state>0 , bit_state);
			node_id = this.equation.get_node_next_id1(start_id);
			if (node_id){
				this.trace_battery(node_id , out_state);
			}
			node_id = this.equation.get_node_next_id2(start_id);
			if (node_id){
				this.trace_battery(node_id , out_state);
			}
			break;
		case NODE_BACK_CONTACT:
			out_state = -this.update_cycle;
			bit_state = this.bit_states[this.equation.get_node_name(start_id)];
			if (!bit_state){
				out_state = in_state;
			}
			this.equation_elements[start_id].change_states(in_state>0 , bit_state);
			node_id = this.equation.get_node_next_id1(start_id);
			if (node_id){
				this.trace_battery(node_id , out_state);
			}
			node_id = this.equation.get_node_next_id2(start_id);
			if (node_id){
				this.trace_battery(node_id , out_state);
			}
			break;
		case NODE_COIL:
			bit_state = this.bit_states[this.equation.get_node_name(start_id)];
			this.equation_elements[start_id].change_states(in_state>0 , bit_state);
			this.equation_out_state = in_state>0;
			break;
		default:
	}
	
};

Equation_SVG.prototype.update = function(bit_name , new_state){
	if (!this.equation){
		return;
	}
	if ( ! (bit_name in this.bit_states)){
		return;
	}
	this.update_cycle++;
	this.bit_states[bit_name] = new_state;
	this.equation_out_state = false;
	this.trace_battery(this.equation.start_id , this.update_cycle);
};

Equation_SVG.prototype.hide = function(){
	if ( ! (this.svg.parentNode)){
		return;
	}
	this.svg.parentNode.removeChild(this.svg);

};

Equation_SVG.prototype.show = function(parent, bottom){
	if ( this.svg.parentNode){
		this.svg.parentNode.removeChild(this.svg);
	}
	if (bottom){
		parent.appendChild(this.svg);
	}
	else {
		parent.insertBefore(this.svg , parent.firstChild);
	}
};

Equation_SVG.prototype.is_shown = function(){
	return (this.svg.parentNode != null);
};


Equation_SVG.prototype.highlight = function(bitlist = []){
	for (let i = 0 ; i < this.equation_elements.length ; i++ ){
        this.equation_elements[i].highlight(bitlist);
    }
};

			return i;

function find_ML2_coder(ml2text){
	let coders = [];
	let match = ml2text.match(/[\s;]toggle\s+([^\s]+)\s+([^;]+);/i);
	while (match){
		let coderOutput = match[1].toUpperCase();
		coders.push( {target:coderOutput , def:{} , equation:"" , statement:match[0].slice(1).replace(/\s+/g , " ").replace(/\s*:\s*/g , ":").replace(/ ON /g , "\nON ")});
		let coderDefs = match[2].toUpperCase().split(/\s*,\s*/i);
		let controlBits = [];

		let coderMatch = coderDefs[0].toUpperCase().match(/on\s+for\s+([\d]+)\s*:\s*(msec|sec|min)\s+then\s+off\s+for\s+([\d]+)\s*:\s*(msec|sec|min)\s+if\s+(.+)/i);
		let onTime = parseInt(coderMatch[1]);
		let onUnit = coderMatch[2];
		let onTimeMSEC = 0;
		let offTime = parseInt(coderMatch[3]);
		let offUnit = coderMatch[4];
		let offTimeMSEC = 0;
		let period = 0;
		if (onUnit == "MSEC"){
			period += onTime;
			onTimeMSEC = onTime;
		}
		else if (onUnit == "SEC"){
			period += onTime * 1000;
			onTimeMSEC = onTime * 1000;
		}
		else {
			period += onTime * 60000;
			onTimeMSEC = onTime * 60000;
		}
		if (offUnit == "MSEC"){
			period += offTime;
			offTimeMSEC = offTime;
		}
		else if (offUnit == "SEC"){
			period += offTime * 1000;
			offTimeMSEC = offTime * 1000;
		}
		else {
			period += offTime * 60000;
			offTimeMSEC = offTime * 60000;
		}
		let ppm = (60000/period).toFixed(0)+ ".PULSE.PER.MINUTE.1";
		while (true){
			if (!(ppm in pulses)){
				break;
			}
			if (pulses[ppm].on == onTimeMSEC && pulses[ppm].off == offTimeMSEC){
				break;
			}
			let check = ppm.match(/(.*)\.(\d+)$/i);
			ppm = check[1] + "." + (parseInt(check[2])+1).toString();
		}
		let control = coderMatch[5];
		controlBits.push(control);
		coders[coders.length-1].def[ppm] = {on:`ON: ${onTime} ${onUnit}` , off:`OFF: ${offTime} ${offUnit}`};
		pulses[ppm] = {on: onTimeMSEC , off: offTimeMSEC , state: "OFF" , toggle: "OFF" , counter: 0};
		let eq_str = `ASSIGN ${ppm} * ${control}`;
		for (let i = 1 ; i < coderDefs.length ; i++){
			coderMatch = coderDefs[i].toUpperCase().match(/on\s+for\s+([\d]+)\s*:\s*(msec|sec|min)\s+then\s+off\s+for\s+([\d]+)\s*:\s*(msec|sec|min)\s+if\s+(.+)/i);
			onTime = parseInt(coderMatch[1]);
			onUnit = coderMatch[2];
			offTime = parseInt(coderMatch[3]);
			offUnit = coderMatch[4];
			period = 0;
			if (onUnit == "MSEC"){
				period += onTime;
				onTimeMSEC = onTime;
			}
			else if (onUnit == "SEC"){
				period += onTime * 1000;
				onTimeMSEC = onTime * 1000;
			}
			else {
				period += onTime * 60000;
				onTimeMSEC = onTime * 60000;
			}
			if (offUnit == "MSEC"){
				period += offTime;
				offTimeMSEC = offTime;
			}
			else if (offUnit == "SEC"){
				period += offTime * 1000;
				offTimeMSEC = offTime * 1000;
			}
			else {
				period += offTime * 60000;
				offTimeMSEC = offTime * 60000;
			}
			ppm = (60000/period).toFixed(0) + ".PULSE.PER.MINUTE.1";
			while (true){
				if (!(ppm in pulses)){
					break;
				}
				if (pulses[ppm].on == onTimeMSEC && pulses[ppm].off == offTimeMSEC){
					break;
				}
				let check = ppm.match(/(.*)\.(\d+)$/i);
				ppm = check[1] + "." + (parseInt(check[2])+1).toString();
			}
			control = coderMatch[5];
			coders[coders.length-1].def[ppm] = {on:`ON: ${onTime} ${onUnit}` , off:`OFF: ${offTime} ${offUnit}`};
			pulses[ppm] = {on: onTimeMSEC , off: offTimeMSEC , state: "OFF" , toggle: "OFF" , counter: 0};
			eq_str += ` + ${ppm} `;
			eq_str += ` * ${control}`;
			for (let i = controlBits.length-1 ; i >= 0 ; i--){
				let bit = controlBits[i];
				eq_str += ` * ~${bit}`;
			}
			
			controlBits.push(control);
		}
		eq_str += " TO " + coderOutput + ";";
		coders[coders.length-1].equation = eq_str;

		ml2text = ml2text.slice(match.index + match[0].length);
		//ml2text = ml2text.slice(match.index + match[0].length + 1);
		match = ml2text.match(/[\s;]toggle\s+([^\s]+)\s+([^;]+);/i);
	}
	return coders;	
}

function togglePulses(){
	for (let ppm in pulses){
		let ppmDef = pulses[ppm];
		if ( ppmDef.state == "TOGGLE"){
			ppmDef.counter += DT;
			if (ppmDef.toggle == "OFF" && ppmDef.counter > ppmDef.off){
				ppmDef.toggle = "ON";
				ppmDef.counter = 0;
				for (var i = 0 ; i < eq_list.length ; i++){
					eq_list[i].update(ppm , true);
				}
			}
			else if (ppmDef.toggle == "ON" && ppmDef.counter > ppmDef.on){
				ppmDef.toggle = "OFF";
				ppmDef.counter = 0;
				for (var i = 0 ; i < eq_list.length ; i++){
					eq_list[i].update(ppm , false);
				}
			}
		}
	}
}


function find_ML2_boards(ml2text){
	let boards = {"OUT16":[] , "IN16":[] , "NV.IN32.OUT32":[] , "NV.IN32":[] , "NV.OUT32":[]};
	let out16Boards = ml2text.match(/board\s*:\s*[^;]+\stype\s*:\s*out16\s+output\s*:[^;]+;/sig);
	if (out16Boards == null){
		out16Boards = [];
	}
	for (let board of out16Boards){
		boardDef = board.toUpperCase().replace(/\s*:\s*/g , " : ").replace(/\s*,\s*/g,",").replace(/\s*;/ , ";").replace(/\s+/g , " ").match(/board : ([^\s]+)\s.*?type : out16 output : (.+);/i)
		let newBoard = {boardName:boardDef[1] , inputs:[] , outputs:boardDef[2].split(",") , nvinputs:[] , nvoutputs:[]};
		while (newBoard.outputs.length < 16){
			newBoard.outputs.push("SPARE");
		}

	}
	
	let in16Boards = ml2text.match(/board\s*:\s*[^;]+\stype\s*:\s*in16\s+input\s*:[^;]+;/sig);

		let newBoard = {boardName:boardDef[1] , inputs:boardDef[2].split(",") , outputs:[] , nvinputs:[] , nvoutputs:[]};
		while (newBoard.inputs.length < 16){
			newBoard.inputs.push("SPARE");
		}
		boards["IN16"].push(newBoard);
	}
	
	let nv_in32_out32_Boards = ml2text.match(/board\s*:\s*[^;]+\stype\s*:\s*nv\.in32\.out32\s+nv\.output\s*:.+?;\s*nv\.input\s*:[^;]+;/sig);

		let newBoard = {boardName:boardDef[1] , inputs:[] , outputs:[] , nvinputs:boardDef[3].split(",") , nvoutputs:boardDef[2].split(",")};
		while (newBoard.nvinputs.length < 32){
			newBoard.nvinputs.push("SPARE");
		}
		while (newBoard.nvoutputs.length < 32){
			newBoard.nvoutputs.push("SPARE");
		}
		boards["NV.IN32.OUT32"].push(newBoard);
	}
	
	let nv_in32_Boards = ml2text.match(/board\s*:\s*[^;]+\stype\s*:\s*nv\.in32\s+nv\.input\s*:[^;]+;/sig);
	if (nv_in32_Boards == null){
		nv_in32_Boards = [];
	}
	for (let board of nv_in32_Boards){
		boardDef = board.replace(/\s*:\s*/g , " : ").replace(/\s*,\s*/g,",").replace(/\s*;/ , ";").replace(/\s+/g , " ").match(/board : ([^\s]+)\s.*?type : nv\.in32 nv\.input : (.+);/i)
		let newBoard = {boardName:boardDef[1] , inputs:[] , outputs:[] , nvinputs:boardDef[2].split(",") , nvoutputs:[]};
		while (newBoard.nvinputs.length < 32){
			newBoard.nvinputs.push("SPARE");
		}
		boards["NV.IN32"].push(newBoard);
	}
	
	let nv_out32_Boards = ml2text.match(/board\s*:\s*[^;]+\stype\s*:\s*nv\.out32\s+nv\.output\s*:[^;]+;/sig);
	if (nv_out32_Boards == null){
		nv_out32_Boards = [];
	}
	for (let board of nv_out32_Boards){
		boardDef = board.replace(/\s*:\s*/g , " : ").replace(/\s*,\s*/g,",").replace(/\s*;/ , ";").replace(/\s+/g , " ").match(/board : ([^\s]+)\s.*?type : nv\.out32 nv\.output : (.+);/i)

		while (newBoard.nvoutputs.length < 32){
			newBoard.nvoutputs.push("SPARE");
		}
		boards["NV.OUT32"].push(newBoard);
	}
	
	return boards;
}

function find_ML2_timers(ml2text){
	let timers = {};
	let match = ml2text.match(/:\s*SET\s*=.*?\s+CLEAR\s*=[^;]*/i);
	while (match){
		let timedef = match[0].slice(1).trim();
		let set_time = timedef.slice(timedef.search(/=/)+1,timedef.search(/:/)).trim();
		let set_unit = timedef.slice(timedef.search(/:/)+1,timedef.search(/clear/i)).trim();
		timedef = timedef.slice(timedef.search(/\sclear\s*=/i));
		let clear_time = timedef.slice(timedef.search(/=/)+1,timedef.search(/:/)).trim();
		let clear_unit = timedef.slice(timedef.search(/:/)+1).trim();
		
		let set_str = set_time!="0" ? set_time + " " + set_unit : undefined;
		let clear_str = clear_time!="0" ? clear_time + " " + clear_unit : undefined;
		let bits = [];
		let buffer1 = "";
		let buffer2 = "";
		let i = match.index-1;
		while (i >= 0){
			let c = ml2text[i].toUpperCase();
			if ( c.search(/\s/) == 0 ){
				//space encountered
				if (buffer1 != ""){
					if (buffer2 != ""){
						bits.push(buffer2);
					}
					buffer2 = buffer1;
					buffer1 = "";
				}
			}
			else if ( c == "," ){
				//comma encountered
				if (buffer1 != ""){
					if (buffer2 != ""){
						bits.push(buffer2);
					}
					buffer2 = buffer1;
					buffer1 = "";
				}
				
			}
			else {
				//char encountered
				buffer1 = c + buffer1;
				
			}
			if (buffer2 == "BITS" || buffer2 == "ADJUSTABLE" || buffer2 == "FIXED"){
				buffer1 = "";
				buffer2 = "";
				break;
			}
			i--;
		}
		if (buffer2 != ""){
			bits.push(buffer2);
		}
		if (buffer1 != ""){
			bits.push(buffer1);
		}
		for (let bit of bits){
			timers[bit.trim()] = {type:"MLK" , set:set_str , clear:clear_str , counter:0};
		}
		
		ml2text = ml2text.slice(match.index + match[0].length + 1);
		match = ml2text.match(/:\s*SET\s*=.*?\s+CLEAR\s*=[^;]*/i);
	}
	return timers;	
}


function ML2_time_ms(time_str){
	if (!time_str){
		return 0;
	}
	let time = Number(time_str.split(/\s+/)[0]);
	let unit = time_str.split(/\s+/)[1];
	switch (unit) {
		case "MSEC":
			return time;
		case "SEC":
			return time * 1000;
		case "MIN":
			return time * 60000;
		default:
			return time;
	}
}

			}
		}
	}
}

function find_non_vital(ml2text){
	let nv_defs = ml2text.match(/NV\.(INPUT\s*:|OUTPUT\s*:|BOOLEAN\s+BITS\s+)[^;]*/gi);
	if (!nv_defs){
		console.log("No Non-Vital");
		return {};
	}
	let non_vital = {};
	for (let def of nv_defs){
		//console.log(def);
		if (def.search(":") != -1){
			//console.log(def.split(":").slice(1).join(" ").trim().split(/\s*,\s*/));
			for (let bit of def.split(":").slice(1).join(" ").trim().split(/\s*,\s*/)){
				non_vital[bit] = false;
			}
		}
		else if (def.search(/\sBITS\s/i) != -1){
			//console.log(def.split(/\sBITS\s/i).slice(1).join(" ").trim().split(/\s*,\s*/));
			for (let bit of def.split(/\sBITS\s/i).slice(1).join(" ").trim().split(/\s*,\s*/)){
				non_vital[bit] = false;
			}
		}
	}

	return non_vital;
	
}

		let bitDefault = "0";
		if (bitConfig.includes(",")){
			bitDesc = bitConfig.split(":")[1].split(",")[0];
			bitDefault = bitConfig.split(":")[1].split(",")[1];
		}
		else {
			bitDesc = bitConfig.split(":")[1]
		}
		userBits.push({bit:bit , description:bitDesc , default:bitDefault});
	}
	return userBits;
}

function find_stations(link){
	let stations = []
	let linkDef = link.text;
	let stationDefs = linkDef.match(/[\s;](adjustable\s+)*(mii.address|mii.nv.address|address)\s*:\s*([^\s]+)\s.*?(nv\.input|nv\.output|input|output)\s*\:/sig);
	if (!stationDefs){
		console.log("Cannot find stations in LINK: " + link.name);
		return stations;
	}
	let stationIndex = [];
	for (let stationDef of stationDefs){
		stationIndex.push(linkDef.indexOf(stationDef));
	}
	stationIndex.push(linkDef.length);
	
	for (let i = 0 ; i < stationIndex.length-1 ; i++){
		let stationText = linkDef.slice(stationIndex[i] , stationIndex[i+1]);
		let addressDef = stationText.match(/[\s;](mii\.address|mii\.nv\.address|address)\s*:\s*([^\s]+)\s/si);
		let station = {name:addressDef[2] , addressType:addressDef[1] , address:addressDef[2] , peerAddress:"" , peerIP1a:"" , peerIP1b:"" , peerIP2a:"" , peerIP2b:"" , bitlists:[] , text:stationText};
		let stationName = stationText.match(/\sstation\.name\s*:\s*([^\s;]*)\s*;/si);
		if (stationName){
			station.name = stationName[1];
		}
		let peerAddr = stationText.match(/\speer\.address\s*:\s*([^\s;]*)\s*;/si);
		if (peerAddr){
			station.peerAddress = peerAddr[1];
		}
		let peerIP1a = stationText.match(/\speer\.ip\.address\.1\.a\s*:\s*([^\s;]*)\s*;/si);
		if (peerIP1a){
			station.peerIP1a = peerIP1a[1];
		}
		let peerIP1b = stationText.match(/\speer\.ip\.address\.1\.b\s*:\s*([^\s;]*)\s*;/si);
		if (peerIP1b){
			station.peerIP1b = peerIP1b[1];
		}
		let peerIP2a = stationText.match(/\speer\.ip\.address\.2\.a\s*:\s*([^\s;]*)\s*;/si);
		if (peerIP2a){
			station.peerIP2a = peerIP2a[1];
		}
		let peerIP2b = stationText.match(/\speer\.ip\.address\.2\.b\s*:\s*([^\s;]*)\s*;/si);
		if (peerIP2b){
			station.peerIP2b = peerIP2b[1];
		}
		let bitlists = stationText.match(/(nv\.)*(output|input|numeric\.output\.\d+|numeric\.input\.\d+)\s*:[^;]*;/sig);
		for (let list of bitlists){
			let listParse = list.match(/((?:nv\.)*(?:output|input|numeric\.output\.\d+|numeric\.input\.\d+))\s*:([^;]*);/si);
			station.bitlists.push( {type:listParse[1] , list:listParse[2].trim().split(/\s*,\s*/)} );
		}
		stations.push(station);
		
	}
	return stations;
}

function find_links(ml2text){
	let comm = ml2text.match(/comm\s(.*?)(?:boolean\s+bits\s|numeric\s*variables\s|attributes\s|timer\s+bits\s|coded\s+outputs\s|log\s|constants\s|arrays\s|configuration\s|logic\s+begin\s)/si);
	if (!comm){
		console.log("Cannot find COMM section");
		return [];
	}
	comm = comm[1].toUpperCase().trim().replace(/link\s*:\s*/gi , "LINK:");
	let links = [];
	for (let linkDef of comm.split(/link\s*:\s*/si).slice(1)){
		let link = {name:linkDef.split(/\s+/)[0] , protocol:"" , port:"" , port2:"" , baud:"" , stations:[] , text: "LINK: "+linkDef};
		link.protocol = linkDef.match(/protocol\s*:\s*([^\s]*)\s/si)[1];
		link.port = linkDef.match(/(?:\sadjustable)*\s+port\s*:\s*([^;]+)\s*;/si)[1];
		if (linkDef.match(/(?:\sadjustable)*\s+port2\s*:\s*([^;]+)\s*;/si)){
			link.port2 = linkDef.match(/(?:\sadjustable)*\s+port2\s*:\s*([^;]+)\s*;/si)[1];
		}
		if (linkDef.match(/(?:\sadjustable)*\s+baud\s*:\s*([^;]+)\s*;/si)){
			link.baud = linkDef.match(/(?:\sadjustable)*\s+baud\s*:\s*([^;]+)\s*;/si)[1];
		}
		else {
			if (link.protocol == "GENISYS.SLAVE" || link.protocol == "GENISYS.MASTER"){
				link.baud = "300 [DEFAULT]";
			}
			else if (link.protocol == "MICROLOK.SLAVE" || link.protocol == "MICROLOK.MASTER"){
				link.baud = "2400 [DEFAULT]";
			}
			else if (link.protocol == "MII.PEER"){
				link.baud = "19200 [DEFAULT]";
			}
		}
		link.stations = find_stations(link);
		links.push(link);
	}
	return links;

}

					let b = list.list[i];
					if (b === bit){
						let bitDeclaration = `LINK[<span style="color:cyan;">${link.name}</span>] : STATION[<span style="color:cyan;">${station.name}</span>] : ${list.type} : ` + "BIT " + (i+1).toString();
						
						let ip_ports = {};
						for (let b of text_input.value.toUpperCase().matchAll(/board\s*:\s*([^\s]+)\s.*?\senable\s*:\s*(0|1)\s+type\s*:\s*([^\s]+)/sig)){

								let params = text_input.value.slice(b.index+b[0].length).trimLeft().replaceAll(/(adjustable|fixed|:|;)/ig, " ").split(/\s+/);
								while (params[0].slice(0,6) == "E.PORT"){
									if (params[0] == "E.PORT1"){
										EP1_address = params[4];
									}
									else {
										EP2_address = params[4];
										break;
									}
									params.splice(0,9);
								}
								ip_ports[`"${b[1]}.E.PORT1"`] = EP1_address; 
								ip_ports[`"${b[1]}.E.PORT2"`] = EP2_address; 
							}

						}
						
						
						let port1_ip = "";
						if (link.port in ip_ports){
							port1_ip = ` - ${ip_ports[link.port]}`;
						}

						bitDeclaration += `\n -- PROTOCOL: ${link.protocol}\n -- PORT : ${link.port + port1_ip}\n`;
						if (link.port2 != ""){
							let port2_ip = "";
							if (link.port2 in ip_ports){

							}
							bitDeclaration += ` -- PORT2: ${link.port2 + port2_ip}\n`;
						}
						bitDeclaration += ` -- ${station.addressType}: ${station.address}\n`;
						if (station.peerAddress != ""){
							bitDeclaration += ` -- PEER.ADDRESS: ${station.peerAddress}\n`;
						}
						if (station.peerIP1a != ""){
							bitDeclaration += ` -- PEER.IP.ADDRESS.1.A: ${station.peerIP1a}\n`;

function update(){
	//alert("updating...");
	pulses = {};
	if (pulseInterval != -1){
		clearInterval(pulseInterval);
	}
	if (TIMER_LOOP_ID != -1){
		clearInterval(TIMER_LOOP_ID);
	}
	eq_list = [];
	BITS = {};
	bit_search.value = "";
	while (equation_display.children.length != 0){
		equation_display.removeChild(equation_display.lastChild);
	}
	var eq_strs = [];
	TIMERS = {};
	CODERS = [];
	BOARDS = {};
	LINKS = [];
	USER_BITS = [];
	
	let non_vital = {};
	for (let n = 1 ; n <= 8 ; n++){
		non_vital["LED."+n.toString()] = false;
	}
	for (let n = 1 ; n <= 32 ; n++){
		non_vital["AUX"+n.toString()+".INPUT"] = false;
	}
	let log_bits = [];
	// if (text_input.value.match(/(NV\.)*ASSIGN\s+.*?\s+TO\s+.*?;/gi) !== null){
	if (text_input.value.match(/(NV\.)*ASSIGN\s[^;]*?;/gi) !== null){
		text_input.value = remove_comments(text_input.value);
		TIMERS = find_ML2_timers(text_input.value);
		let nv = find_non_vital(text_input.value);
		for (let bit in nv){
			non_vital[bit] = nv[bit];
		}
		CODERS = find_ML2_coder(text_input.value);
		for (let coder of CODERS){
			eq_strs.push(coder.equation);
		}
		BOARDS = find_ML2_boards(text_input.value);
		LINKS = find_links(text_input.value);
		log_bits = find_log_bits(text_input.value);
		USER_BITS = find_user_bits(text_input.value);
		let text_input_str = text_input.value.replace(/[\n\r]/g , "\t").replace(/\(/g , " ( ").replace(/\)/g , " ) ");
		let logic_sect = text_input_str.match(/logic\s+begin\s+.*?end\s+logic/i);
		if (logic_sect) {
			logic_sect = logic_sect[0];
		}
		else {
			logic_sect = text_input_str;
		}
		eq_strs = eq_strs.concat(logic_sect.match(/(NV\.)*ASSIGN\s+.*?\s+TO\s+.*?;/gi));
		if (!eq_strs || eq_strs.length == 0){
			alert("No equations found.\nOpen Input Textbox to add equations then press 'Update'");
			return;
		}
	}
	else {
		//eq_strs = [];
		let lines = text_input.value.split(/[\n\r]/);
		let delay = "";
		for (let i = 0 ; i < lines.length ; i++){
			if (lines[i] !== "" && lines[i][0] != "*"){
				if (lines[i].trim().toUpperCase().search(/(BOOL|SLOW)\s+[^=]*?=\s*\(/) == 0){
					eq_strs.push(lines[i]);
					while (lines[i].trim().endsWith("+") || lines[i].trim().endsWith("*") || lines[i].trim() == ""){
						i++;
						eq_strs[eq_strs.length-1] += lines[i].trim();
					}
					let outbits = eq_strs[eq_strs.length-1].trim().toUpperCase().replace(/(SLOW|BOOL)/ , "").split("=")[0].trim().split(/\s*,\s*/);
					if (eq_strs[eq_strs.length-1].trim().toUpperCase().search(/SLOW\s+/) != -1){
						for (let bit of outbits){
							if (bit != ""){
								TIMERS[bit.trim().toUpperCase()] = {type:"VPI" , set:"SLOW" , clear:"SLOW"};
							}
						}
						delay = "";
					}
					else if (delay != ""){
						for (let bit of outbits){
							if (bit != ""){
								TIMERS[bit.trim().toUpperCase()] = {type:"VPI" , set:delay , clear:undefined};
							}
						}
						delay = "";
					}
				}
				else if (lines[i].trim().toUpperCase().search(/TIME\s+DELAY\s+=/) == 0){
					delay = lines[i].trim().toUpperCase().split("=").slice(1).join("").trim();
				}
			}
		}
	}
	
	var i;
	for(i=0 ; i < eq_strs.length ; i++ ){
		var eq_obj = format_equation(eq_strs[i]);
		
		if (eq_obj.error != ""){
			alert("Error with equation " + (i+1) + ":\n"+ eq_strs[i] + "\n\n" + eq_obj.error);
		}
		else{
			let coderDef = undefined;
			for (let coder of CODERS){
				if (coder.equation == eq_strs[i]){
					coderDef = coder.def;
					break;
				}
			}
			var equation = new Equation_SVG(eq_obj.outputs , eq_obj.expression , eq_obj.eq_type , TIMERS , non_vital , coderDef , log_bits);
            equation.svg.addEventListener("dblclick" , append_eq);
			for (let bit of equation.equation_inputs){
				BITS[bit] = false;
			}
			for (let bit of equation.equation_outputs){
				BITS[bit] = false;
			}
			eq_list.push(equation);
			equation.show(equation_display , true);
		}
	}
	run();

	let bit_usage = tally_bits();
	let warning = "";
	for (let bit in bit_usage){
		if ((bit.search("PULSE.PER.MINUTE") >= 0) && bit_usage[bit] > 16){
			let def;
			for (let coder of CODERS){
				if (bit in coder.def){
					def = coder.def[bit].on + " THEN " + coder.def[bit].off;
					def = def.replaceAll(/\s*:\s*/gi , " FOR ").replaceAll(/\sMSEC/gi , ":MSEC").replaceAll(/\sSEC/gi , ":SEC").replaceAll(/\sMIN/gi , ":MIN");
				}
			}
			warning += `Coded Output Definition: ${def} (${bit}) is used ${bit_usage[bit]} times. Cannot be more than 16 times per definition.\n\n`;
		}
		else if (bit_usage[bit] > 499){
			warning += `${bit} is used ${bit_usage[bit]} times. Might cause logic queue to overflow and crash during operation\n\n`;
		}
	}
	if (warning){
		alert("Warning:\n"+warning);
	}
	
	pulseInterval = setInterval(togglePulses , DT);
	TIMER_LOOP_ID = setInterval(process_ML2_timers , TIMER_LOOP_DT);
}

function check_changes(){
	let changes = [];
	for (var i = 0 ; i < eq_list.length ; i++){
		let eq_out = eq_list[i].equation_out_state;
		let eq_outputs = eq_list[i].equation_outputs;
		let eq_type = eq_list[i].equation_type;
		for (let output of eq_outputs){
			if (BITS[output] !== eq_out && !(output in TIMERS) && (eq_type == "MLKV" || eq_type == "MLKNV")){
				changes.push(output);
			}
		}
	}
	return changes;
}

function get_equation_svg(bit){
	for (var i = 0 ; i < eq_list.length ; i++){
		if (eq_list[i].equation_outputs.includes(bit)){
			return eq_list[i];
		}
	}
	return undefined;
}

RUN_CYCLES_MAX = 5000;
PROGRAM_STATE = -1;
function run(){
	if (PROGRAM_STATE < 0){
		return;
	}
	let cycles = 0;
	let changes = check_changes();
	let history = [];
	while (changes.length !== 0){
		console.log(changes.length , changes.join(" "));
		while (changes.length !== 0){
			let change = changes.shift();
			let eqSVG = get_equation_svg(change);
			change_bit_state(change , eqSVG.equation_out_state);
		}
		changes = check_changes();
		history.push(changes.join(" "));
		if (history.length > 10){
			history.shift();
		}
		cycles++;
		if (cycles > RUN_CYCLES_MAX){
			let message = "Logic not able to stablize after " + RUN_CYCLES_MAX.toString() + " cycles.\n\nLast 10 cycles:\n";
			for (let i = 10 ; i > 0 ; i--){
				message += i.toString() + ") " + history[i-1] + "\n";
			}
			message += "\nKeep trying?";
			
			let cont = confirm(message);
			if (cont){
				cycles = 0;
			}
			else {
				run_btn();
				break;
			}
		}
	}
}

function run_btn(){
	let run_button = document.getElementById("RUN_BUTTON");
	if (PROGRAM_STATE > 0){
		PROGRAM_STATE = -1;
		run_button.innerHTML = "RUN";
	}
	else {
		PROGRAM_STATE = 1;
		run_button.innerHTML = "PAUSE";
		run();
	}
}

					message += "<pre><mark>Equation:</mark>\nEquation " + (i+1).toString() + " of " + eq_strs.length.toString() + ":\n";
					let equation = eq_strs[i][0];
					let count = -10;
					for (let j = 1 ; j < eq_strs[i].length ; j++){
						let c = eq_strs[i][j];
						equation += c;
						count += 1;
						if (count > 110 && (equation.slice(equation.length-5) == " XOR " || equation.slice(equation.length-4) == " OR " || equation.slice(equation.length-5) == " AND " || equation.slice(equation.length-4) == " TO " || equation.slice(equation.length-2) == ", ")){
							equation += "\n";
							count = 0;
						}
					}
					message += equation.replace(/ OR /g, " <font color=magenta>+</font> ").replace(/ XOR /g, " <font color=magenta>@</font> ").replace(/ AND /g, " <font color=magenta>*</font> ").replace(/(\s)NOT /g, "$1<font color=magenta>~</font>").replace(/;/g, "<font color=cyan>;</font>").replace(/\( /g, "(").replace(/ \)/g, ")") +"\n</pre>";
					message += "<pre>";
					let numNot = eq_strs[i].match(/ NOT /g) ? eq_strs[i].match(/ NOT /g).length : 0;
					let numAnd = eq_strs[i].match(/ AND /g) ? eq_strs[i].match(/ AND /g).length : 0;
					let numOr = eq_strs[i].match(/ OR /g) ? eq_strs[i].match(/ OR /g).length : 0;
					let numXor = eq_strs[i].match(/ XOR /g) ? eq_strs[i].match(/ XOR /g).length : 0;
					message +=   "  Number of NOT operators: " + numNot.toString().padStart(3);
					message += "\n  Number of AND operators: " + numAnd.toString().padStart(3);
					message += "\n  Number of  OR operators: " + numOr.toString().padStart(3);
					message += "\n  Number of XOR operators: " + numXor.toString().padStart(3);
					message += "\n--------------------------------";
					message += "\nTotal number of operators: " + (numNot + numAnd + numOr + numXor).toString().padStart(3);
					message += "</pre>";
					message += eq_svg[i].outerHTML.replace(/Inconsolata/gi , "monospace");
                }
            }
            else {
				message += "<pre><mark>Equation:</mark>\nNo equation for '" + evt.target.textContent + "' is found</pre>";
            }
			
			message += "<pre><mark>Additional Information:</mark>\n";
			
			message += "Number of equation which used this bit: " + eq_used.length.toString() + "\nFront: " + front_count + "\nBack: " + back_count + "\nBits Affected: ";
			let bitsAffected = [];
			for (let eqSVG of eq_used){
				bitsAffected = bitsAffected.concat(eqSVG.equation_outputs);
			}
			if (bitsAffected.length == 0){
				message += "0\nNone";
			}
			else {
				message += `${bitsAffected.length}\n`;
				let bitsAffectedMessage = "";
				let bitsAffectedMessageLength = 0;
				for (let bit of bitsAffected){
					bitsAffectedMessage += `${bit}, `;
					bitsAffectedMessageLength += bit.length+2;
					if (bitsAffectedMessageLength > 110){
						message += bitsAffectedMessage + "\n";
						bitsAffectedMessage = "";
						bitsAffectedMessageLength = 0;
					}
				}
				if (bitsAffectedMessage == ""){
					message = message.slice(0,message.length-3);
				}
				else {
					message += bitsAffectedMessage.slice(0,bitsAffectedMessage.length-2);
				}					
			}
			message += "</pre>";
			
			//console.log(evt);
			let stat = window.open("","_blank","popup=1");
			stat.document.body.bgColor = "black";
			// stat.document.body.innerHTML = '<font color="white" size="4">' + message + "</font>";
			stat.document.body.style =  "font-family:monospace; font-size:18px; color: white;";
			stat.document.body.innerHTML =  message;
			stat.document.head.innerHTML = SVG_STYLE_HTML;
			stat.window.resizeTo(1200,1000);
			stat.window.moveTo(evt.screenX-600,evt.screenY-500);
			stat.document.title = evt.target.textContent;
			evt.preventDefault();
            break;
		case 2:
			var pattern =  "^" + evt.target.textContent + "$";
			if (evt.shiftKey){ //trying to remove filter
				if (bit_search.value.indexOf(pattern) == -1){
					return;
				}
				bit_search.value = bit_search.value.replace(pattern , "").replace(/\s+/g , "    ");
			}
			else { //adding filter
				if (bit_search.value.indexOf(pattern) != -1){
					return;
				}
				bit_search.value += "  " + pattern + "  ";
			}
			for (let textElement of document.getElementsByClassName("TEXT")){
				textElement.style.fill = "";
			}
			filter_equation_display();
			break;
		default:
			alert(evt.button);
	}
}

function tally_bits(){
	let bits = {};
	for (let eq of eq_list){
		let checked = {};
		for (let bit of eq.equation.inputs){
			if (! (bit in bits)){
				bits[bit] = 0;
			}
			// bits[bit] += eq.equation.outputs.length;
			if (! checked[bit] ){
				bits[bit] += 1;
				checked[bit] = true;
			}
			
		}
		for (let bit of eq.equation.outputs){
			if (! (bit in bits)){
				bits[bit] = 0;
			}
		}
	}
	return bits;
	
}





function format_equation(equation){
    equation = equation.trim().toUpperCase().replace(/\s+/g , " ");
    if (equation.indexOf("SLOW ") != 0 && equation.indexOf("BOOL ") != 0 && equation.charAt(equation.length-1) != ";"){
        equation += ";";
    }

    var return_value = {error:"" , inputs:[] , outputs:[] , expression:[] , eq_type:"" };
    
    if ( equation.indexOf("BOOL ") == 0 && equation.indexOf("=") != -1 && equation.match(/=/g).length === 1 && equation.charAt(equation.length-1) == ")" ){
        return_value.eq_type = "VPI_BOOL";
	}
	else if ( equation.indexOf("SLOW ") == 0 && equation.indexOf("=") != -1 && equation.match(/=/g).length === 1 && equation.charAt(equation.length-1) == ")" ){
        return_value.eq_type = "VPI_SLOW";
	}
    else if ( equation.indexOf("ASSIGN ") == 0 && equation.indexOf(" TO ") != -1 && equation.match(/ TO /g).length === 1 && equation.charAt(equation.length-1) == ";" ){
        return_value.eq_type = "MLKV";
	}
    else if ( equation.indexOf("NV.ASSIGN ") == 0 && equation.indexOf(" TO ") != -1 && equation.match(/ TO /g).length === 1 && equation.charAt(equation.length-1) == ";" ){
        return_value.eq_type = "MLKNV";
	}
    else {
		return_value.error = "ERROR: Equation must be in the form:\n\n";
		return_value.error += "1) ASSIGN <logic_expr> TO <out_list>;\n";
		return_value.error += "2) NV.ASSIGN <logic_expr> TO <out_list>;\n";
		return_value.error += "3) BOOL <out_list> = ( <logic_expr> )";
		return_value.error += "4) SLOW <out_list> = ( <logic_expr> )";
        return return_value;
	}
        
    
    equation = equation.replace(/\*/g, " AND ");
    equation = equation.replace(/\+/g, " OR ");
    equation = equation.replace(/\(/g, " ( ");
    equation = equation.replace(/\)/g, " ) ");
	var ops , outs;
    if (return_value.eq_type == "VPI_BOOL"){
        if (equation.indexOf("~") != -1){
			return_value.error = "ERROR: ~ is not a support operator for VPI equations. Use '.N.' for NOT operation.";
            return return_value;
		}
        equation = equation.replace(/\.N\./g, " NOT ");
        ops = equation.replace("BOOL" , "").split("=")[1].trim();
        outs = equation.replace("BOOL" , "").split("=")[0].trim();
	}
	else if (return_value.eq_type == "VPI_SLOW"){
        if (equation.indexOf("~") != -1){
			return_value.error = "ERROR: ~ is not a support operator for VPI equations. Use '.N.' for NOT operation.";
            return return_value;
		}
        equation = equation.replace(/\.N\./g, " NOT ");
        ops = equation.replace("SLOW" , "").split("=")[1].trim();
        outs = equation.replace("SLOW" , "").split("=")[0].trim();
	}
    else {
        equation = equation.replace(/\&/g, " AND ");
        equation = equation.replace(/\|/g, " OR ");
        equation = equation.replace(/\~/g, " NOT ");
        equation = equation.replace(/\!/g, " NOT ");
        equation = equation.replace(/\@/g, " XOR ");
        equation = equation.replace(/\^/g, " XOR ");
        ops = equation.replace(/(NV\.)*ASSIGN / , "").replace(";","").split(" TO ")[0].trim();
        outs = equation.replace(/(NV\.)*ASSIGN / , "").replace(";","").split(" TO ")[1].trim();
	}

    if (outs == ""){
		return_value.error = "ERROR: Output list is empty";
        return  return_value;
	}
    if (ops == ""){
		return_value.error = "ERROR: Logic expression is empty";
        return return_value;
	}
    
	ops = ops.split(/\s+/);
    var paren_count = 0;
	var idx;
    for (idx=0 ; idx<ops.length ; idx++){
        if (ops[idx] == "("){
            paren_count += 1;
		}
        if (ops[idx] == ")"){
            paren_count -= 1;
		}
        if (paren_count < 0){
            break;
		}
	}
    if (paren_count != 0){
		return_value.error = "Error: Parenthesis mismatch";
        return  return_value;
	}

    if ( ["AND","OR","XOR"].indexOf(ops[0]) != -1 ){
		return_value.error = "Error: Logic expression cannot start with '" + ops[0] + "'";
        return return_value;
	}
    
    for (idx=0 ;  idx<ops.length-1 ; idx++){
        if  ( ["AND","OR","NOT","XOR",")","("].indexOf(ops[idx]) == -1 &&  ['AND','OR',"XOR",')'].indexOf(ops[idx + 1]) == -1 ){
			return_value.error = "Error 1: Syntax error at '" + ops[idx] + " " + ops[idx + 1] + "'";
            return  return_value;
		}
        
        if ( ["AND","OR","NOT","XOR"].indexOf(ops[idx]) != -1 && [")","AND","OR","XOR"].indexOf(ops[idx + 1]) != -1 ){
            return_value.error = "Error 2: Syntax error at '" + ops[idx] + " " + ops[idx + 1] + "'";
            return  return_value;
		}
        
        if (ops[idx] == ")" && ["AND","OR","XOR",")"].indexOf(ops[idx + 1]) == -1 ){
            return_value.error = "Error 3: Syntax error at '" + ops[idx] + " " + ops[idx + 1] + "'";
            return  return_value;
		}
        
        if ( ops[idx] == "(" && ["AND","OR",")","XOR"].indexOf(ops[idx + 1]) != -1 ){
            return_value.error = "Error 4: Syntax error at '" + ops[idx] + " " + ops[idx + 1] + "'";
            return  return_value;
		}
	}
    if ( ["AND","OR","NOT","XOR"].indexOf(ops[ops.length-1]) != -1 ){
		return_value.error = "Error: Logic expression cannot end with '" + ops[ops.length-1] + "'";
        return  return_value;
	}
	
	

	outs = outs.split(",");
	var outbit;
	var out_list = [];
    for (idx=0 ; idx<outs.length ; idx++){
		outbit = outs[idx];
        if (outbit.trim().split(/\s+/).length > 1){
			return_value.error = "Error: Check output list";
            return  return_value;
		}
        out_list.push(outbit.trim());
	}
	
	for (idx=0 ; idx<ops.length ; idx++){
        if ( ["AND","OR","NOT",")","(","XOR"].indexOf(ops[idx]) == -1 && return_value.inputs.indexOf(ops[idx]) == -1 ){
			return_value.inputs.push(ops[idx]);
		}
	}
	return_value.expression = ops;
	return_value.outputs = out_list;
    return return_value;
}


function remove_comments(equation_string){
	var ml_lines = equation_string.toUpperCase().replace(/\r/g , "\n").split(/\n/);
	var formatted = "";
	var line_num = 0;
	var lc = "\/\/";
	var bc1s = "/\*";
	var bc1e = "\*\/";
	var bc2s = "\%";
	var bc2e = "\\";
	while( line_num < ml_lines.length){
		var line = ml_lines[line_num];
		if ( line.indexOf(lc) == -1 && line.indexOf(bc1s) == -1 &&  line.indexOf(bc2s) == -1 ){
			formatted += line + "\n";
			ml_lines[line_num] = "";
			line_num += 1;
		}
		else if ( line.indexOf(lc) != -1 && line.slice(0,line.indexOf(lc)).indexOf(bc1s) == -1 && line.slice(0,line.indexOf(lc)).indexOf(bc2s) == -1 ){
			formatted += line.slice(0,line.indexOf(lc)) + "\n";
			ml_lines[line_num] = "";
			line_num += 1;
		}
		//else if bc1s in line and lc not in line[0:line.find(bc1s)] and bc2s not in line[0:line.find(bc1s)]{
		else if ( line.indexOf(bc1s) != -1 && line.slice(0,line.indexOf(bc1s)).indexOf(lc) == -1 && line.slice(0,line.indexOf(bc1s)).indexOf(bc2s) == -1 ){
			formatted += line.slice(0,line.indexOf(bc1s)) + "\n";
			ml_lines[line_num] = line.slice(line.indexOf(bc1s)+2);
			line = ml_lines[line_num];
			while ( line.indexOf(bc1e) == -1 ) {
				ml_lines[line_num] = "";
				line_num +=1;
				line = ml_lines[line_num];
			}
			ml_lines[line_num] = line.slice(line.indexOf(bc1e)+2);
		}
		//else if bc2s in line and lc not in line[0:line.find(bc2s)] and bc1s not in line[0:line.find(bc2s)]{
		else if ( line.indexOf(bc2s) != -1 && line.slice(0,line.indexOf(bc2s)).indexOf(lc) == -1 && line.slice(0,line.indexOf(bc2s)).indexOf(bc1s) == -1 ){
			formatted += line.slice(0,line.indexOf(bc2s)) + "\n";
			ml_lines[line_num] = line.slice(line.indexOf(bc2s)+1);
			line = ml_lines[line_num];
			while ( line.indexOf(bc2e) == -1 ) {
				ml_lines[line_num] = "";
				line_num +=1;
				line = ml_lines[line_num];
			}
			ml_lines[line_num] = line.slice(line.indexOf(bc2e)+1);
		}
	}
	
	return formatted;

}
